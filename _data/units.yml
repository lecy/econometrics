        - { label: Slides (PDF), url: lectures1/p-05-program-impact.pdf, kind: pdf }
        - { label: PPTX, url: lectures1/p-05-program-impact.pptx, kind: pptx, download: true }
    - title: Sample vs. Sampling Distribution
