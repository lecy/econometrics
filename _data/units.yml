- id: science-in-crisis
  part: "Part 4 — Research Integrity and Evidence Synthesis"
  number: "22"
  title: Science in Crisis
  tagline: Findings that do not replicate, results that cannot be reproduced, and data that were never real.
  summary: >
    Reviews the evidence behind three related crises: published findings that fail when the
    study is run again, results that cannot be regenerated even from the authors' own data and
    code, and outright fabrication. An annotated bibliography collects the large-scale projects
    that measured each problem.
  overview: |
    Three different failures are often lumped together, and it helps to keep them apart.

    A finding **replicates** when a new study with new data reaches the same conclusion. Large
    replication projects recover roughly half of published findings, and many-analyst studies
    show that dozens of competent teams given the *same* data and question can reach different
    answers. A result is **reproducible** when rerunning the original code on the original data
    regenerates the published numbers. Across economics, finance, and management, that simple
    check fails far more often than most researchers expect, usually because of missing files,
    broken code, or data that were never shared. **Fraud** is the deliberate case: fabricated
    or manipulated data, and the incentives that make it pay.

    Each bibliography entry below says in a sentence or two what the study found and why it
    matters. Unit 23 turns to the tools a reader can use to check published work.
  objectives:
    - Distinguish replicability, robustness, and reproducibility, and give an example of a failure of each.
    - Summarize what large replication, many-analyst, and reproducibility projects found about the reliability of published research.
    - Explain why analytic choices that are never reported can change a study's conclusion.
    - Describe the incentives that make fabrication and questionable research practices rational for individual researchers.
  lectures:
    - title: Research Fraud and the Reproducibility Crisis
      blurb: Retraction trends, a timeline of high-profile cases, the new forensic tools, paper mills and pay-to-publish economics, and the incentives that make misconduct rational.
      links:
        - { label: Notes, url: lectures4/open-science/research-fraud-trends-notes.html, kind: notes }
        - { label: Slides (PDF), url: lectures4/open-science/trends_in_research_fraud.pdf, kind: pdf }
        - { label: PPTX, url: lectures4/open-science/trends_in_research_fraud.pptx, kind: pptx, download: true }
  reading_groups:
    - group: Replication Crisis
      intro: New data, the same question, a different answer. Includes many-analyst studies, where the data are held fixed and the analysts vary.
      items:
        - title: Replicability, Robustness, and Reproducibility in Psychological Science
          cite: "Nosek, B. A., Hardwicke, T. E., Moshontz, H., et al. (2022). Annual Review of Psychology, 73, 719–748."
          note: The field's own review of a decade of replication projects. It defines the three terms, summarizes how often findings held up, and lays out the reforms that followed; the best single overview of the crisis.
          url: pubs/reproducibility/2022-annual-review-psychology.pdf
        - title: Trouble at the Lab
          cite: "The Economist (2013, October 19)."
          note: A widely read account of why so much published science is wrong and the incentives that keep it that way. A good first reading for anyone new to the problem.
          url: lectures4/open-science/pubs/Trouble-at-the-lab-The-Economist.pdf
        - title: "Psychology's Replication Crisis Is Real, Many Labs 2 Says"
          cite: "Yong, E. (2018, November 19). The Atlantic."
          note: Nearly 200 psychologists reran 28 published experiments with volunteers from 36 countries, and only 14 replicated. Results barely differed across cultures, so the failures could not be blamed on who was in the sample.
          url: lectures4/open-science/pubs/Psychology%27s%20Replication%20Crisis%20Is%20Real%20ATLANTIC.pdf
        - title: When the Revolution Came for Amy Cuddy
          cite: "Dominus, S. (2017, October 18). The New York Times Magazine."
          note: The power-posing study, its failed replications, and what the reform movement cost the researcher at its center. A reminder that replication debates involve people as well as p-values.
          url: lectures4/open-science/pubs/When%20the%20Revolution%20Came%20for%20Amy%20Cuddy.pdf
        - title: "Bootstrapping in Applied Linguistics: Assessing Its Potential Using Shared Data"
          cite: "Plonsky, L., Egbert, J., & LaFlair, G. T. (2015). Applied Linguistics, 36(5), 591–610."
          note: Reanalyzing the raw data from 26 published studies, 4 of 16 significant results did not survive bootstrapping, a false-positive rate about five times the nominal .05. An early demonstration of what shared data allow others to check.
          url: pubs/reproducibility/2015-computational-linguistics.pdf
        - title: "Outliers in L2 Research in Applied Linguistics: A Synthesis and Data Re-Analysis"
          cite: "Nicklin, C., & Plonsky, L. (2020). Annual Review of Applied Linguistics, 40, 26–55."
          note: Across 104 studies, researchers used widely different rules for discarding outlying observations. Reanalysis of 19 shared datasets shows how much these small, rarely justified choices vary, and that a log transformation usually makes them unnecessary.
          url: pubs/reproducibility/2020-computational-linguistics.pdf
        - title: Observing Many Researchers Using the Same Data and Hypothesis Reveals a Hidden Universe of Uncertainty
          cite: "Breznau, N., Rinke, E. M., Wuttke, A., et al. (2022). PNAS, 119(44), e2203150119."
          note: Seventy-three teams tested whether immigration reduces public support for social policy using identical data, and reported widely diverging estimates and conclusions. More than 95% of the variation could not be explained by any coded analytic decision.
          url: pubs/reproducibility/2022-pnas-many-results-same-data-and-question.pdf
        - title: Variation Across Analysts in Statistical Significance, yet Consistently Small Effect Sizes
          cite: "Mathur, M. B., Covington, C., & VanderWeele, T. J. (2023). PNAS, 120(3), e2218957120."
          note: A reply to Breznau et al. arguing the teams' estimates barely differed; 90% of standardized effects fell within ±0.037 SD. The "variation" was mostly in which tiny estimates crossed p < .05, a lesson in reading effect sizes rather than significance.
          url: pubs/reproducibility/2023-pnas-response-to-2022-pnas.pdf
        - title: A Universe of Uncertainty Hiding in Plain Sight
          cite: "Engzell, P. (2023). PNAS, 120(2), e2218530120."
          note: A second reply. The teams were in effect testing several hypotheses, much of the spread is within teams, and the original study reported similar variation, so the project may count as a successful replication of a null finding.
          url: pubs/reproducibility/2023-pnas-response-to-2022-pnas-part-two.pdf
        - title: Nonstandard Errors
          cite: "Menkveld, A. J., Dreber, A., Holzmeister, F., et al. (2024). Journal of Finance, 79(3), 2339–2390."
          note: One hundred sixty-four teams tested the same hypotheses on the same market data. The spread across teams, which the authors call nonstandard errors, was sizable, smaller for better-rated research, and underestimated by the participants themselves.
          url: pubs/reproducibility/2024-finance-nonstandard-errors.pdf
    - group: Reproducibility Crisis
      intro: The same data and the same code, run again. Does it return the published numbers?
      items:
        - title: A Large-Scale Study on Research Code Quality and Execution
          cite: "Trisovic, A., Lau, M. K., Pasquier, T., & Crosas, M. (2022). Scientific Data, 9, 60."
          note: Of more than 9,000 R scripts in Harvard Dataverse replication packages, 74% failed on a clean first run and 56% still failed after automated cleanup. Most failures came from missing files, hard-coded paths, and missing packages that good habits prevent.
          url: pubs/reproducibility/2022-code-quality-and-execution-on-harvard-dataverse.pdf
        - title: Reproducibility in Management Science
          cite: "Fisar, M., Greiner, B., Huber, C., Katok, E., Ozkes, A. I., & the Management Science Reproducibility Collaboration (2024). Management Science, 70(3), 1343–1356."
          note: More than 700 reviewers attempted to reproduce nearly 500 articles. Under the journal's 2019 data and code policy, over 95% of articles with accessible data reproduced, but inaccessible data brought the overall rate to 68%; before the policy only 12% of articles shared materials at all.
          url: pubs/reproducibility/2024-management-science.pdf
        - title: A Community Effort Towards Reproducible Management Science
          cite: "Fisar, M., Greiner, B., Huber, C., Katok, E., & Ozkes, A. I. (2023). Management Science Review (INFORMS blog)."
          note: A short, readable summary of the project above and its recommendations for journals. Read this first if you only have ten minutes.
          url: pubs/reproducibility/2023-management-science.pdf
        - title: "Computational Reproducibility in Finance: Evidence from 1,000 Tests"
          cite: "Pérignon, C., Akmansoy, O., Hurlin, C., et al. (2024). Review of Financial Studies (forthcoming)."
          note: Running 168 teams' own code on the same raw data regenerated exactly the same results only 52% of the time. Reproducibility tracked coding skill and effort rather than seniority, and researchers were strongly overconfident about their own.
          url: pubs/reproducibility/2024-finance-computational-reproducibility.pdf
        - title: "Mass Reproducibility and Replicability: A New Hope"
          cite: "Brodeur, A., Mikola, D., Cook, N., et al. (2024). I4R Discussion Paper No. 107. Institute for Replication."
          note: The Institute for Replication reproduced 110 papers from leading economics and political science journals. Over 85% were computationally reproducible, but about 25% contained coding errors and roughly 70% held up under robustness checks.
          url: pubs/reproducibility/2024-economics-mass-reproducibility.pdf
    - group: Research Fraud
      intro: Data that were fabricated or manipulated. The lecture notes above cover retraction trends, recent cases, and the forensic tools that caught them.
      items:
        - title: A Mysterious Company's Coronavirus Papers in Top Medical Journals May Be Unraveling
          cite: "Servick, K., & Enserink, M. (2020, June 2). Science."
          note: The Surgisphere case, in which a hospital database no one could verify supported high-profile COVID-19 papers in The Lancet and NEJM. Researchers and amateur sleuths, not peer reviewers, flagged the implausible numbers, and both papers were retracted two days later.
          url: pubs/open-science/a-mysterious-companys-coronavirus-papers-in-top-medical-journals-may-be-unraveling.pdf

- id: research-integrity
  part: "Part 4 — Research Integrity and Evidence Synthesis"
  number: "23"
  title: Research Integrity and Open Science
  tagline: How published findings go wrong, and the tools any reader can use to check them.
  summary: >
    Surveys the ways a published literature can mislead, from individual fabrication and coding
    errors to p-hacking, publication bias, paper mills, and incentives that reward volume over
    verification. Pairs each problem with the evidence of its scale, the tools that detect it,
    and the open-science practices that prevent it.
  overview: |
    Every estimator in this course assumes the numbers going into it are honest and the numbers
    coming out are reported faithfully. This unit asks what happens when they are not. Retractions
    are growing several times faster than publications; large replication projects in psychology
    and economics recover roughly half of published findings, at about half the original effect
    size; and many teams given the same data reach different conclusions.

    The problems are sorted by unit of analysis: the **individual** (fabrication, image
    manipulation, plagiarism, honest coding errors), the **team** (p-hacking, HARKing, fragile
    specifications, the file drawer), the **group** (citation rings, fake peer review, paper mills),
    and the **field** (publication bias, incentives, the missing culture of replication, lost data).
    Many of the detection tools — GRIM, SPRITE, statcheck, p-curve, funnel plots, specification
    curves — need nothing more than what is printed in a paper, which means any careful reader can
    use them.
  objectives:
    - Distinguish fabrication, questionable research practices, and honest error, and explain why each calls for different tools.
    - Apply simple consistency checks (GRIM, statcheck) to reported statistics.
    - Explain how p-hacking, the garden of forking paths, and publication bias inflate published effect sizes.
    - Describe the open-science practices — preregistration, registered reports, open data and code — that prevent each problem.
  lectures:
    - title: A Research Integrity Toolkit
      blurb: >
        Seventeen problems organized from the individual to the field, each with its evidence of
        scope, detection tools, and remedies. The framework table condenses the whole deck onto a
        few pages.
      links:
        - { label: Notes, url: lectures4/open-science/research-integrity-toolkit-notes.html, kind: notes }
        - { label: Slides (PDF), url: lectures4/open-science/research_integrity_slides.pdf, kind: pdf }
        - { label: PPTX, url: lectures4/open-science/research_integrity_slides.pptx, kind: pptx, download: true }
        - { label: Framework table (PDF), url: lectures4/open-science/research_integrity_framework.pdf, kind: pdf }
        - { label: Framework (DOCX), url: lectures4/open-science/research_integrity_framework.docx, kind: docx, download: true }
    - title: "Toolkit Guides: Checking Reported Statistics"
      blurb: >
        GRIM asks whether a reported mean is possible given N; SPRITE reconstructs the raw data a
        mean and SD imply; statcheck recomputes p-values from reported test statistics. None needs
        the raw data. The short companion deck shows why summary statistics alone can hide almost
        any distribution.
      links:
        - { label: GRIM (PDF), url: lectures4/open-science/guides/01_grim_guide.pdf, kind: pdf }
        - { label: SPRITE (PDF), url: lectures4/open-science/guides/01_sprite.pdf, kind: pdf }
        - { label: statcheck (PDF), url: lectures4/open-science/guides/01_statcheck.pdf, kind: pdf }
        - { label: Companion slides (PDF), url: lectures4/open-science/data/SPRITE.pdf, kind: pdf }
    - title: "Toolkit Guides: Detecting p-Hacking"
      blurb: >
        Four tools that read the distribution of test statistics across a literature: p-curve,
        p-uniform, the caliper test around p = .05, and z-curve's estimated replication rate.
      links:
        - { label: p-curve (PDF), url: lectures4/open-science/guides/02a1_pcurve_guide.pdf, kind: pdf }
        - { label: p-uniform (PDF), url: lectures4/open-science/guides/02a1_puniform_guide.pdf, kind: pdf }
        - { label: Caliper test (PDF), url: lectures4/open-science/guides/02a1_caliper_guide.pdf, kind: pdf }
        - { label: z-curve (PDF), url: lectures4/open-science/guides/02a1_zcurve_guide.pdf, kind: pdf }
    - title: "Toolkit Guides: Forking Paths and the File Drawer"
      blurb: >
        Multiverse analysis, specification curves, and vibration of effects show how much a result
        depends on defensible modeling choices; funnel plots, trim-and-fill, PET-PEESE, and the
        excess-significance test estimate what the missing null results would have said.
      links:
        - { label: Forking paths (PDF), url: lectures4/open-science/guides/02a2_forking_paths.pdf, kind: pdf }
        - { label: Publication bias (PDF), url: lectures4/open-science/guides/02a3_publication_bias_guide.pdf, kind: pdf }
    - title: "Toolkit Guides: Networks, Data Stewardship, and What Comes Next"
      blurb: >
        Bibliometric tools for citation rings and editor networks, FAIR-compliance scoring for
        shared data, and the open problems the toolkit does not yet solve. The compiled toolkit
        collects every guide in one file.
      links:
        - { label: Bibliometrics (PDF), url: lectures4/open-science/guides/02b_bibliometric_guide.pdf, kind: pdf }
        - { label: FAIR data (PDF), url: lectures4/open-science/guides/03_fair_data_guide.pdf, kind: pdf }
        - { label: Future work (PDF), url: lectures4/open-science/guides/10_future_work.pdf, kind: pdf }
        - { label: Toolkit contents (PDF), url: lectures4/open-science/guides/00_table_of_contents.pdf, kind: pdf }
        - { label: Complete toolkit (PDF), url: lectures4/open-science/guides/RESEARCH-INTEGRITY-TOOLKIT.pdf, kind: pdf }
        - { label: All guides (ZIP), url: lectures4/open-science/guides/research-integrity-methods.zip, kind: data, download: true }
  readings:
    - title: The Influence of Hidden Researcher Decisions in Applied Microeconomics
      cite: "Huntington-Klein, N., et al. (2021). Economic Inquiry, 59(3), 944–960. Independent teams replicate published studies from the same data and get different answers."
      url: lectures4/open-science/pubs/The%20influence%20of%20hidden%20researcher%20decisions%20in%20applied%20microeconomics.pdf

- id: meta-analysis
  part: "Part 4 — Research Integrity and Evidence Synthesis"
  number: "24"
  title: "Meta-Analysis: The Class Size Debate"
  tagline: When dozens of studies disagree, put them on one scale and ask why.
  summary: >
    Introduces meta-analysis as the quantitative synthesis of effect sizes across studies, then
    works through the class size literature as a case study: a century of contradictory findings,
    Glass and Smith's first meta-analysis, the Hanushek–Krueger dispute over how to count
    studies, and the modern consensus of roughly 0.20 SD in the early grades.
  overview: |
    A single study, however well designed, is one draw from a sampling distribution of studies.
    Meta-analysis treats the literature itself as the data: convert every study's estimate to a
    common effect size, weight each by its precision, and model why the estimates differ. The
    first half of the unit covers the tools — standardized mean differences (Cohen's *d*, Hedges'
    *g*, Glass's Δ), conversions from *t*, *F*, *r*, odds ratios, and regression coefficients, and
    how to code an effect size from each of the designs in Part 3.

    The second half applies them to a question you met in Lab P102: **does class size matter?**
    For seventy years narrative reviews called the evidence hopelessly mixed, largely because
    confounding by SES and teacher assignment pushed naive estimates in both directions. Glass and
    Smith (1979) put 725 comparisons on one scale and found a clear, nonlinear benefit of small
    classes. Hanushek counted estimates and saw no consistent effect; Krueger gave each study one
    vote and saw a positive one. Tennessee's STAR experiment and Shin and Chung's (2009) synthesis
    point to about 0.20 SD in grades K–3 — with the caveat that one experiment supplies most of
    the evidence.
  objectives:
    - Compute and interpret Cohen's d, Hedges' g, and Glass's Δ, and distinguish a standardized mean difference from a standardized mean change.
    - Convert reported statistics (t, F, r, odds ratios, regression and DiD coefficients) into a common effect size.
    - Read a forest plot and a funnel plot, and explain the difference between common- and random-effects models.
    - Explain how the unit of analysis, study quality, and dependence among effect sizes shape the conclusions of the class size literature.
    - Build a coding template that extracts comparable effect sizes from class size studies.
  lectures:
    - title: What Is Meta-Analysis?
      blurb: Research synthesis as a study of studies — forest plots, pooled estimates, moderators, funnel plots — and the standardized effect sizes that make it possible.
      links:
        - { label: Notes, url: lectures4/meta_analysis/meta-analysis-intro-notes.html, kind: notes }
        - { label: Slides (PDF), url: lectures4/meta_analysis/meta-analysis-overview.pdf, kind: pdf }
        - { label: PPTX, url: lectures4/meta_analysis/meta-analysis-overview.pptx, kind: pptx, download: true }
        - { label: Effect sizes handout (PDF), url: lectures4/meta_analysis/Applied_Meta_Analysis_Intro.pdf, kind: pdf }
        - { label: SMD vs. SMC (PDF), url: lectures4/meta_analysis/SMD_vs_SMC.pdf, kind: pdf }
    - title: Putting Every Study on One Scale
      blurb: >
        The common effect size metrics, the formulas that convert between them, and how to code an
        effect size from a t-test, a regression, an interrupted time series, a DiD, a fixed-effects
        model, or an RDD.
      links:
        - { label: Notes, url: lectures4/meta_analysis/effect-size-conversions-notes.html, kind: notes }
        - { label: Conversions handout (PDF), url: lectures4/meta_analysis/Common_Effect_Sizes_and_Conversions.pdf, kind: pdf }
        - { label: Design table (XLSX), url: lectures4/meta_analysis/MetaAnalysis_EffectSize_ModelComparison.xlsx, kind: data, download: true }
        - { label: R Templates, url: lectures4/meta_analysis/effect_size_calculation_templates.R, kind: rmd, raw: true }
    - title: "Case Study: Does Class Size Matter?"
      blurb: >
        A century of contested evidence as a worked example of research synthesis — confounding,
        Glass and Smith's meta-analysis, the Hanushek–Krueger debate, STAR, and what the modern
        consensus does and does not support.
      links:
        - { label: Notes, url: lectures4/meta_analysis/class_size/class-size-debate-notes.html, kind: notes }
        - { label: Evidence review (PDF), url: lectures4/meta_analysis/class_size/Class_Size_Evidence_Review.pdf, kind: pdf }
        - { label: DOCX, url: lectures4/meta_analysis/class_size/Class_Size_Evidence_Review.docx, kind: docx, download: true }
    - title: "Case Study: Coding Class Size Studies"
      blurb: >
        Turning the literature into data: what to record about each study's design, treatment
        contrast, outcome, timing, and controls, and how to convert its estimate into an effect
        size.
      links:
        - { label: Notes, url: lectures4/meta_analysis/class_size/class-size-coding-notes.html, kind: notes }
        - { label: Evidence review (PDF), url: lectures4/meta_analysis/class_size/Class_Size_Evidence_Review.pdf, kind: pdf }
        - { label: DOCX, url: lectures4/meta_analysis/class_size/Class_Size_Evidence_Review.docx, kind: docx, download: true }
    - title: "Replication: Examples from Shin & Chung (2009)"
      blurb: >
        Five studies from Shin and Chung's sample, coded step by step: where each statistic sits in the
        paper, the decisions behind each effect size, and what the coding reveals about the
        meta-analysis, from repeated reports of the same STAR children to a quasi-experiment with four
        defensible estimates.
      links:
        - { label: "1. Finn & Achilles (1990)", url: lectures4/meta_analysis/class_size/replication/class-size-replication-finn-achilles.html, kind: notes }
        - { label: "2. Finn & Achilles (1999)", url: lectures4/meta_analysis/class_size/replication/class-size-replication-finn-achilles-1999.html, kind: notes }
        - { label: "3. Molnar et al. (1999)", url: lectures4/meta_analysis/class_size/replication/class-size-replication-molnar.html, kind: notes }
        - { label: "4. Goldstein & Blatchford (1998)", url: lectures4/meta_analysis/class_size/replication/class-size-replication-goldstein-blatchford.html, kind: notes }
        - { label: "5. Nye et al. (1992)", url: lectures4/meta_analysis/class_size/replication/class-size-replication-nye.html, kind: notes }
        - { label: "R: case 1", url: lectures4/meta_analysis/class_size/replication/finn_achilles_1990.R, kind: rmd, raw: true }
        - { label: "R: case 2", url: lectures4/meta_analysis/class_size/replication/finn_achilles_1999.R, kind: rmd, raw: true }
        - { label: "R: case 3", url: lectures4/meta_analysis/class_size/replication/molnar_1999.R, kind: rmd, raw: true }
        - { label: "R: case 4", url: lectures4/meta_analysis/class_size/replication/goldstein_blatchford_1998.R, kind: rmd, raw: true }
        - { label: "R: case 5", url: lectures4/meta_analysis/class_size/replication/nye_1992.R, kind: rmd, raw: true }
    - title: "Replication: A Meta-Analysis of the Omission Bias"
      blurb: >
        Yeung, Yay, and Feldman (2022) posted their whole review on the OSF. Trace it from search terms
        to 49 coded effect sizes, then rerun the analysis and find what the published code got wrong.
      links:
        - { label: "Notes: search to data", url: lectures4/meta_analysis/omission_bias/omission-bias-replication-data-prep.html, kind: notes }
        - { label: "Notes: analysis", url: lectures4/meta_analysis/omission_bias/omission-bias-replication-analysis.html, kind: notes }
        - { label: Paper (PDF), url: lectures4/meta_analysis/omission_bias/yeung-et-al-2021.pdf, kind: pdf }
        - { label: Analysis (Rmd), url: lectures4/meta_analysis/omission_bias/analysis/omission-bias-analysis.Rmd, kind: rmd, raw: true }
        - { label: Data prep (R), url: lectures4/meta_analysis/omission_bias/data/ob_data_prep.R, kind: rmd, raw: true }
  readings:
    - title: Meta-Analysis and the Science of Research Synthesis
      cite: "Gurevitch, J., Koricheva, J., Nakagawa, S., & Stewart, G. (2018). Nature, 555, 175–182. A short overview of the method and its history."
      url: lectures4/meta_analysis/class_size/META-2018-overview-of-science-of-research-synthesis.pdf
    - title: Meta-Analysis of Research on Class Size and Achievement
      cite: "Glass, G. V., & Smith, M. L. (1979). Educational Evaluation and Policy Analysis, 1(1), 2–16. The first meta-analysis of the class size literature."
      url: lectures4/meta_analysis/class_size/META-1979-glass-and-smith.pdf
    - title: Evidence, Politics, and the Class Size Debate
