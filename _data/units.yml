- id: more-campbell-scores
  part: "Part 2 — Research Design and Counterfactuals"
  number: "11"
  title: Two Studies, Same Data, Opposite Conclusions
  tagline: A riddle in two chapters, and the estimator choice that resolves it.
  overview: |
    Chapters 20 and 21 evaluate the same school choice program using the same data and reach
    opposite conclusions: Chapter 20 finds the program ineffective, Chapter 21 finds it
    effective. Nothing about the data changed.

    Two things differ. Chapter 21 uses a strong counterfactual where Chapter 20 uses a weak
    comparison group — and, more importantly, each chapter calculates program effects with a
    different estimator. Work out which of the three each author used and the divergence
    stops being mysterious.

    The time-frame question is subtler than it looks. If a study collects four years of data
    but analyses only one, its time-frame is one year, not four. Here the time-frame is a
    function of how effects are calculated, not of how long collection ran.
  objectives:
    - Reverse-engineer which counterfactual estimator a published study actually used.
    - Explain how estimator choice alone can flip a conclusion about program effectiveness.
    - Define a study's analytic time-frame separately from its data collection window.
  readings:
    - title: "Evaluation of a School Choice Program (Ch. 20 and Ch. 21)"
      cite: "Bingham & Felbinger. Focus on Tables 10A–10D and the regression models in 11A and 11B."
      url: pubs/eval-in-practice-CH20-CH21-school-choice.pdf
    - title: "Pre-Post with Control (Ch. 5)"
      cite: Companion chapter for comparing designs.
      url: pubs/evaluation-in-practice-CH5-pre-post-with-control.pdf
  lectures:
    - title: No new lectures this unit
      blurb: >
        The exercises draw on the counterfactual and Campbell Score material already covered.
        The four decks below are the ones you will need at hand.
      links:
