      cite: "Torres-Reyna, Princeton. Notes on reading fixed and random effects output in practice."
      url: https://www.princeton.edu/~otorres/Panel101.pdf
    - title: Why I Don't Use the Term "Fixed and Random Effects"
      cite: "Gelman (2005). The terms mean different things in different disciplines."
      url: https://statmodeling.stat.columbia.edu/2005/01/25/why_i_dont_use/
    - title: Fixed, Mixed, and Random Effects
      cite: "Stoudt (2017), Practical Statistics blog. How the models are estimated."
      url: https://rlbarter.github.io/Practical-Statistics/2017/03/03/fixed-mixed-and-random-effects/
