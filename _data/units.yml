- id: campbell-scores
  part: "Part 2 — Research Design and Counterfactuals"
  number: "11"
  title: Campbell Scores
  tagline: Ten competing hypotheses that could explain your result instead of the program.
  summary: >
    Evaluates a study's internal validity as a structured search for competing explanations of
    its results. Each of the ten Campbell Score items is a rival hypothesis that must be ruled
    out, with selection and attrition treated as guilty until proven innocent.
  overview: |
    A framework for evaluating the internal validity of a study as a structured search for
    competing hypotheses. The program hypothesis says the change came from the program; each
    Campbell Score item is a rival explanation that has to be ruled out first.

    The scoring rule is asymmetric on purpose. Selection and non-random attrition are so
    common in observational work that they are **guilty until proven innocent** — a study
    must show it handled them. The remaining eight items are innocent until proven guilty:
    you have to argue from evidence in the study that the threat is live.
  objectives:
    - Identify design weaknesses that threaten internal validity and could undermine results.
    - Read an evaluation study efficiently by knowing which tests the author owes you.
    - Score a study on all ten items and defend each score with evidence.
    - Package a description of your own research design so that others can assess it.
  readings:
    - title: "Post-Test Only Estimator (Ch. 7 — hospital follow-up care)"
      cite: Bingham & Felbinger. One of the three studies scored in Lab P203.
      url: pubs/eval-in-practice-CH7-hospital-follow-up-care.pdf
