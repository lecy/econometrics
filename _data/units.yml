- id: fixed-effects
  part: "Part 3 — Regression Tools for Impact Analysis"
  number: "17"
  title: Panel Data with Fixed Effects
  tagline: Let every unit keep its own intercept, and identify the effect from within-unit change.
  summary: >
    With repeated observations on the same units, fixed effects give each unit its own
    intercept, so nothing stable about a unit can confound the estimate. Compares pooled,
    random effects, and fixed effects specifications, and the tests that guide the choice
    among them.
  overview: |
    With repeated observations on the same units, a fixed effects model gives each unit its
    own intercept and estimates the slope from variation *within* units over time. Anything
    stable about a unit — however unmeasurable — is absorbed and can no longer confound the
    estimate.

    The lecture contrasts the pooled model, where every unit shares one intercept, with the
    random effects and fixed effects alternatives, and shows the equivalence between the
    dummy-variable formulation and the demeaned-data formulation.
  objectives:
    - Explain what a unit fixed effect absorbs and what it cannot.
    - Compare pooled, random effects, and fixed effects specifications on the same panel.
    - Fit a fixed effects model both with dummy variables and with the plm package.
  readings:
    - title: "Impact Evaluation in Practice (World Bank)"
      cite: Reference text for panel designs.
      url: pubs/Impact_Evaluation_in_Practice%20WB%20full%20text%20second%20edition.pdf
