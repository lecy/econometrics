- id: measurement
  part: "Part 2 — Research Design and Counterfactuals"
  number: "10"
  title: Measurement Theory
  tagline: Before you estimate an effect, make sure the number measures the thing you care about.
  summary: >
    Most outcomes that public programs care about are latent constructs that can only be
    measured through an instrument, so an estimate is only as good as its measures. Covers
    validity, reliability, Cronbach's alpha, weighted indices built with factor analysis, and
    the politics of performance metrics.
  overview: |
    Every estimator in this course takes the outcome variable on faith. Measurement theory is
    where that faith gets checked. Two Manhattan neighborhoods can post the same poverty rate
    while one is trapped in inter-generational poverty and the other is a way station for
    upwardly mobile immigrant families — same number, different construct.

    Some things can be counted directly. Most of what public programs care about — health,
    happiness, depression, social capital — are *latent constructs* that can only be measured
    through an instrument: a survey scale, a coding protocol, a standardized exam. An
    instrument is **valid** if it measures the construct it claims to, and **reliable** if its
    items measure that construct consistently. Cronbach's alpha is the workhorse statistic for
    the second question, and a scale can often be improved by dropping the item that does not
    belong.

    The unit closes with the politics of measurement: once a metric is tied to rewards and
    penalties, people start managing the metric instead of the outcome.
  objectives:
    - Distinguish direct measures, markers or proxies, and latent constructs.
    - Explain the difference between measurement validity and measurement reliability.
    - Calculate and interpret Cronbach's alpha, and use item correlations to improve a scale.
    - Build weighted composite indices with factor analysis, and explain how it differs from PCA.
    - Identify the perverse incentives that performance metrics can create.
  readings:
    - title: Measurement Theory and Practice
      cite: "Aparasu, R. R. (2011). Research Methods for Pharmaceutical Practice and Policy, Ch. 4. Levels of measurement, reliability, and validity."
      url: pubs/measurement/measurement-theory-and-practice.pdf
    - title: Construct Measurement and Validation Procedures in MIS and Behavioral Research
      cite: "MacKenzie, Podsakoff & Podsakoff (2011). MIS Quarterly, 35(2). The full scale-development process, from conceptual definition to validation."
      url: pubs/measurement/construct-measurement-and-validation-in-behavioral-research.pdf
    - title: Forget the Myers-Briggs, Use the Big Five
      cite: Kelly (2019). HeadStuff. A popular instrument that fails the test-retest reliability standard.
      url: pubs/measurement/forget-the-meyers-briggs.pdf
    - title: Punishing and Toxic Neighborhood Environments Predict Social Mobility
      cite: "Manduca & Sampson (2019). PNAS. What neighborhood measures add beyond the concentrated poverty rate."
      url: pubs/measurement/toxic-neighborhoods-and-social-mobility.pdf
    - title: Management Accounting & Control Scales Handbook
      cite: Schäffer (2007). A reference catalogue of published multi-item scales — look here before writing your own.
      url: pubs/measurement/Management-Accounting-and-Control-Scales-Handbook.pdf
  lectures:
