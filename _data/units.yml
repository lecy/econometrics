      url: pubs/effect-size/Class-Size-Reduction-and-Student-Achievement.pdf

- id: reproducible-workflows
  part: "Part 4 — Research Integrity and Evidence Synthesis"
  number: "25"
  title: Reproducible Workflows
  tagline: Organize code and data so that you, a coauthor, or a stranger can rerun the analysis and get the same answer.
  summary: >
    Turns the reproducibility evidence from Unit 22 into working habits: project structure,
    scripts that run from raw data to final tables without manual steps, version control, and
    documentation. The readings are practical guides written by researchers for researchers.
  overview: |
    Most reproducibility failures in Unit 22 were not fraud. They were missing files, hard-coded
    paths, packages that changed, and steps someone did by hand and never wrote down. Those are
    engineering problems, and software engineers solved most of them long ago.

    A reproducible project keeps raw data read-only, builds every intermediate file from code,
    runs from start to finish with one command, and records the software versions it used. None
    of this requires new statistics; it requires treating your analysis as code that someone
    else will have to run.
  lectures:
    - title: Emerging Data Citation Standards
      blurb: >
        Why datasets deserve citations of their own, how DOIs and Universal Numerical
        Fingerprints identify a specific version of a dataset, semantic versioning for data that
        change over time, and publishing replication files to Harvard Dataverse from R.
      links:
        - { label: Slides (PDF), url: lectures4/data-citation-standards.pdf, kind: pdf }
        - { label: PPTX, url: lectures4/data-citation-standards.pptx, kind: pptx, download: true }
  readings:
    - title: "Code and Data for the Social Sciences: A Practitioner's Guide"
      cite: "Gentzkow, M., & Shapiro, J. M. (2014). Chicago Booth and NBER."
      note: >
        Most empirical social science, day to day, is writing and debugging code, yet few
        researchers are trained to do it, and the authors show how a self-taught approach breaks
        down as projects grow: moved files that change results, merges that silently drop
        observations, sample definitions copied inconsistently across dozens of scripts, and an
        assistant's code no one can rerun. Their rule of thumb: when multi-billion-dollar firms
        and whole university courses exist to solve your problem, learn what the experts do, and
        the guide adapts their practices for automation, version control, directories, keys,
        abstraction, documentation, and project management.
      url: https://web.stanford.edu/~gentzkow/research/CodeAndData.pdf
    - title: "Reproducible Research in R: How to Do the Same Thing More Than Once"
