- id: comparing-estimators
  part: "Part 2 — Research Design and Counterfactuals"
  number: "12"
  title: Comparing the Three Estimators on One Dataset
  tagline: Run all three, test the assumptions, and defend the one you believe.
  overview: |
    The synthesis lab. Return to the cognitive-ability study from Unit 08 and calculate
    program impact three ways — reflexive, post-test only, and difference-in-difference —
    on the same data.

    The regression models are provided. The work is interpretation: read the coefficients
    correctly, identify which counterfactual each model deploys, run the identification
    tests, and decide which estimates you actually believe. Some estimators are valid in this
    context and some are not.
  objectives:
    - Map a fitted regression back to the counterfactual it implements.
    - Run identification tests and check whether each estimator's assumptions hold.
    - Argue in writing for one estimate over the others.
