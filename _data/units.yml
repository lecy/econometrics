- id: interrupted-time-series
  part: "Part 3 — Regression Tools for Impact Analysis"
  number: "15"
  title: Interrupted Time Series
  tagline: One group, many time points, and a policy that lands in the middle of them.
  summary: >
    Models a single unit observed many times before and after an intervention, separating the
    pre-existing trend from what the policy changed. The model distinguishes an immediate
    change in level from a sustained change in slope, and checks the residuals for
    autocorrelation.
  overview: |
    The reflexive counterfactual with enough time points to see a trend. A single unit is
    observed repeatedly before and after an intervention, and the model separates the
    pre-existing trajectory from what the intervention changed.

    `Y = b0 + b1·T + b2·D + b3·P + e`, where `T` counts time, `D` is a treatment dummy
    (0 before, 1 after), and `P` counts time since the intervention. That gives `b1` as the
    pre-intervention trend, `b2` as the immediate level change, and `b3` as the sustained
    change in slope. A policy can have an immediate effect, a sustained effect, both, or
    neither, and the four coefficients tell them apart.
  objectives:
    - Recognize when data are suited to an interrupted time series model.
    - Organize a dataset into the time, treatment, and time-since-treatment variables the model needs.
    - Interpret each coefficient and identify the two counterfactuals in the model.
    - Detect and test for autocorrelation in the residuals.
  readings:
    - title: "Rent Control as a Time Series (Ch. 12)"
      cite: Bingham & Felbinger. A worked interrupted time series in policy.
      url: pubs/eval-in-practice-CH12-rent-control-time-series.pdf
    - title: NYC Robberies Occur as School Gets Out
      cite: A seasonality and cycle example worth reading alongside the lecture.
      url: pubs/nyc-robberies-occur-as-school-gets-out.pdf
    - title: Interrupted Time Series Regression for the Evaluation of Public Health Interventions
      cite: "Bernal, Cummins & Gasparrini (2017), International Journal of Epidemiology. A step-by-step tutorial."
      url: http://www.ag-myresearch.com/uploads/1/3/8/6/13864925/2016_lopezbernal_ije.pdf
    - title: Interrupted Time Series Designs
      cite: "Shadish, Cook & Campbell (2002), Experimental and Quasi-Experimental Designs, ch. 6."
      url: pubs/cook-campbell-shadish-interrupted-time-series.pdf
  lectures:
