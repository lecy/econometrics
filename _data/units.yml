- id: control-variables
  number: "03"
  part: "Part 1 — Regression Foundations"
  title: Control Variables
  tagline: Two kinds of control variable, and the two different things they do to a model.
  summary: >
    Moves from bivariate to multiple regression and shows the two different things a control
    variable can do. Controls related only to the outcome shrink standard errors, while
    controls related to both the treatment and the outcome change the slope.
  overview: |
    Moving from bivariate to multiple regression: `Y = b0 + b1*X1 + b2*X2 + e`, where X1 is
    always the policy variable and everything after it is a control.

    Some controls are correlated with the outcome but not with the treatment — they shrink
    standard errors and buy precision. Others are correlated with both — they move the
    slope. Knowing which kind you have added is the difference between a more efficient
    model and a different answer. Ballentine Venn diagrams are introduced here as the tool
    for keeping the two straight.
  objectives:
    - Predict how adding a given control will change the slopes in a model.
    - Predict how adding a given control will change the standard errors.
    - Use Ballentine diagrams to compare competing specifications.
  readings:
    - title: Multiple Regression
      cite: "Tufte, E. R. (1974). Data Analysis for Politics and Policy, Ch. 4."
      url: pubs/Multiple%20Regression.pdf
  lectures:
    - title: Control Variables
      blurb: What a control variable does to the slope, and what it does to precision.
      links:
        - { label: Notes, url: lectures1/p-06-control-variables-notes.html, kind: notes }
        - { label: Slides (PDF), url: lectures1/p-06-control-variables.pdf, kind: pdf }
        - { label: PPTX, url: lectures1/p-06-control-variables.pptx, kind: pptx, download: true }
    - title: Control Variables in R
      blurb: Worked example with regression tables and partial-effect scatterplots.
      links:
        - { label: Lecture, url: lectures1/control-variables.html, kind: html }
  labs:
    - title: Lab P103 — Control Variables
      blurb: >
        Model code is provided; the work is interpretation. Compare specifications on the
        class-size data and explain what each control is doing to the estimate.
      links:
        - { label: Instructions, url: labs1/lab-03-instructions.html, kind: html }
        - { label: RMD Template, url: labs1/lab-03-template.rmd, kind: rmd, raw: true }

- id: omitted-variable-bias
  number: "04"
  part: "Part 1 — Regression Foundations"
  title: Omitted Variable Bias
  tagline: The variable you left out is still in the model — it is hiding in your slope.
  summary: >
    A variable left out of a model does not disappear; its effect is absorbed into the slopes
    of the variables that remain, by an amount you can calculate. The crack-baby research and
    the doctor-patient racial concordance debate show how omitted variables produce confident
    but wrong conclusions, and why randomization breaks the bias.
  overview: |
    When a variable that belongs in the model is left out, its effect does not disappear.
    It gets absorbed into the coefficients of the variables that remain, in an amount you
    can calculate exactly: `bias = a1 * B2`, where `a1` comes from the auxiliary regression
    of the omitted variable on the policy variable.

    The canonical example is the 1989 "crack baby" research, where a strong apparent effect
    of prenatal cocaine exposure on child development largely dissolved once poverty was
    added to the models. The doctor-patient racial concordance debate is the same story
    playing out in a current literature.
  objectives:
    - Identify variables with the potential to cause omitted variable bias.
    - Calculate the size and direction of bias from omitting a variable.
    - Explain why randomization breaks the bias term.
  readings:
    - title: "Crack Babies: Study Ends with Unexpected but Clear Result"
      cite: The omitted variable was poverty. Required reading for this unit.
      url: pubs/crack-vs-poverty.pdf
    - title: Doctor-Patient Racial Concordance — the original study
      cite: Strong claims from a cross-sectional model.
      url: pubs/racial-concordance-and-disparities-in-birthing-mortality.pdf
    - title: Doctor-Patient Racial Concordance — revisited with controls added
      cite: What happens to the finding once omitted variables enter the model.
      url: pubs/racial-concordance-and-disparities-in-birthing-mortality-revisited.pdf
    - title: Doctor-Patient Racial Concordance — press coverage
      cite: The Economist, on why a correction gets less attention than the finding.
      url: pubs/racial-concordance-and-disparities-in-birthing-mortality-economist.pdf
  lectures:
    - title: Omitted Variable Bias
      blurb: The full model, the naive model, the auxiliary regression, and the bias term.
      links:
        - { label: Notes, url: lectures1/p-07-omitted-variable-bias-notes.html, kind: notes }
        - { label: Slides (PDF), url: lectures1/p-07-omitted-variable-bias.pdf, kind: pdf }
        - { label: PPTX, url: lectures1/p-07-omitted-variable-bias.pptx, kind: pptx, download: true }
    - title: A Taxonomy of Control Variables
      blurb: Confounders, mediators, colliders, and proxies — which to include and which to leave alone.
      links:
        - { label: Notes, url: lectures1/taxonomy-of-control-variables-notes.html, kind: notes }
        - { label: Slides (PDF), url: lectures1/taxonomy-of-control-variables.pdf, kind: pdf }
        - { label: PPTX, url: lectures1/taxonomy-of-control-variables.pptx, kind: pptx, download: true }
    - title: Randomization Breaks Omitted Variable Bias
      blurb: Why an experiment sets the auxiliary slope to zero, and what that buys you.
      links:
        - { label: Notes, url: lectures1/randomization-breaks-ovb-notes.html, kind: notes }
    - title: Calculating Bias — Worked Example
      blurb: Class size and socioeconomic status, with all three regressions run in R.
      links:
        - { label: Walk-through, url: lectures1/walk-through/omitted-variable-bias-example.html, kind: html }
        - { label: PDF, url: lectures1/omitted-variable-bias-example.pdf, kind: pdf }
    - title: Indirect Effects Example
      blurb: Short handout on decomposing an effect that travels through a mediator.
      links:
        - { label: Handout (PDF), url: handouts/indirect-effect-example.pdf, kind: pdf }
  labs:
    - title: Lab P104 — Omitted Variable Bias
      blurb: >
        Estimate the naive model, the full model, and the auxiliary regression on the
        class-size data, then show that the bias term reconciles the two slopes.
      links:
        - { label: Instructions, url: labs1/lab-04-instructions.html, kind: html }
        - { label: RMD Template, url: labs1/lab-04-template.rmd, kind: rmd, raw: true }

- id: dummy-variables
  number: "05"
  part: "Part 1 — Regression Foundations"
  title: Dummy Variables and Interactions
  tagline: Modeling groups, and testing whether a program works differently for each of them.
  summary: >
    Dummy variables let a regression compare groups, and interaction terms let the effect of a
    variable differ from one group to another. Together they turn a single model into a set of
    hypothesis tests about differences in intercepts and slopes.
  overview: |
    Dummy variables are binary 0/1 indicators — one for each level of a categorical variable,
    minus the reference category:

    `y = b0 + b1(X) + b2(D) + e`

    Interactions multiply a covariate by a dummy, which lets the slope itself differ by group:

    `y = b0 + b1(X) + b2(D) + b3(X)(D) + e`

    Together they turn a single regression into a set of hypothesis tests about differences
    between groups — different intercepts, different slopes, or both.
  objectives:
    - Construct dummy variables and choose a sensible reference category.
    - Interpret main effects and interaction terms in the same model.
    - State and test hypotheses about group differences in intercepts and slopes.
  readings:
    - title: Regression with Interaction Effects — practice questions
      cite: Work these before the lab.
      url: handouts/Regression%20with%20Interaction%20Effects.pdf
    - title: Regression with Interaction Effects — solutions
      cite: Check your answers here.
      url: handouts/Regression-with-Interaction-Effects-SOLUTIONS.pdf
    - title: Interaction Effects in Research
      cite: Background on why interactions are so often misread.
      url: pubs/interaction-effects-in-research.pdf
    - title: Visualizing a 2 × 2 × 2 Interaction
      cite: One-page graphic. Fertilizer, water, and sunlight as cell tables, interaction plots, and a fully interacted regression.
      url: handouts/dummy_variable_interactions.png
    - title: "The 2 × 2 × 2 Model: From Main Effects to the Three-Way Interaction"
      cite: One-page graphic. Maps every coefficient to a corner of the cube and the hypothesis test it answers.
      url: handouts/dummy_variable_interactions_3way.png
  lectures:
    - title: Interactions in Regression Models
      blurb: How a single interaction term changes the meaning of every other coefficient.
      links:
        - { label: Notes, url: lectures1/p-08-dummy-variables-notes.html, kind: notes }
        - { label: PPTX, url: lectures1/p-08-dummy-variables.pptx, kind: pptx, download: true }
    - title: Hypothesis Testing with Dummy Variables
      blurb: Which coefficient answers which question about group differences.
      links:
        - { label: Notes, url: lectures1/hypotheses-tests-with-dummy-variables-notes.html, kind: notes }
        - { label: Slides (PDF), url: lectures1/hypotheses-tests-with-dummy-variables.pdf, kind: pdf }
        - { label: PPTX, url: lectures1/hypotheses-tests-with-dummy-variables.pptx, kind: pptx, download: true }
    - title: Three Counterfactual Estimators
      blurb: Pre-post, post-only, and difference-in-difference — each written as a dummy variable regression.
      links:
        - { label: Slides (PDF), url: lectures1/three-counterfactual-estimators.pdf, kind: pdf }
        - { label: PPTX, url: lectures1/three-counterfactual-estimators.pptx, kind: pptx, download: true }
    - title: Groups in Regression Models
      blurb: The R-side treatment — building dummies, setting factor levels, reading output.
      links:
        - { label: Lecture, url: lectures1/dummy-variables.html, kind: html }
        - { label: Worked examples, url: lectures1/dummy-variable-examples-v2.html, kind: html }
  labs:
    - title: Lab P105 — Dummy Variables and Group Hypotheses
      blurb: >
        Construct group indicators, fit models with and without interaction terms, and use
        the coefficients to test explicit hypotheses about group differences.
      links:
        - { label: Instructions, url: labs1/lab-05-instructions.html, kind: html }

- id: specification
  number: "06"
  part: "Part 1 — Regression Foundations"
  title: Specification and Measurement Error
  tagline: What goes wrong when you run the regression without looking at the data.
  summary: >
    Covers the errors that come from fitting the wrong functional form, including non-linear
    relationships and highly leveraged outliers, and the quadratic and log models that fix
    them. Also shows the distinct signatures of measurement error: noise in Y widens
    confidence intervals, while noise in X biases the slope toward zero.
  overview: |
    Specification bias is the error you get from fitting the wrong functional form — a
    straight line through a curved relationship, or a slope dragged around by a highly
    leveraged outlier. Because OLS minimizes *squared* error, a residual twice as large has
    four times the influence, which is why outliers near the extremes of X do so much damage.

    The fixes are quadratic terms for non-linearity and log transformations for skew and for
    modeling growth rates rather than levels. Measurement error is the companion problem:
    error in the dependent variable inflates standard errors, while error in the independent
    variable attenuates the slope toward zero.
  objectives:
    - Diagnose specification bias from residual plots rather than from summary statistics.
    - Identify leveraged outliers and run sensitivity analysis on them.
    - Specify and interpret quadratic and logged regression models.
  readings:
    - title: Anscombe's Quartet
      cite: Four datasets, identical regression output, four completely different stories.
      url: handouts/Anscombes-Quartet.pdf
    - title: Marginal Effects in Quadratic Regression Models
      cite: How to report a slope that changes across the range of X.
      url: handouts/Marginal-Effects-in-Quadratic-Regression-Models.pdf
    - title: Interpreting Logged Regression Models
      cite: Log-linear, linear-log, and log-log specifications side by side.
      url: handouts/Interpretting-Logged-Regression-Models.pdf
  lectures:
    - title: Specification Bias I
      blurb: Non-linearity, outliers, and leverage, worked through in R.
      links:
        - { label: Lecture, url: lectures1/specification-bias.html, kind: html }
    - title: Bias from Specification or Measurement
      blurb: Quadratic and log models, plus the distinct signatures of measurement error in X and Y.
      links:
        - { label: Notes, url: lectures1/p-09-specification-notes.html, kind: notes }
        - { label: Slides (PDF), url: lectures1/p-09-specification.pdf, kind: pdf }
        - { label: PPTX, url: lectures1/p-09-specification.pptx, kind: pptx, download: true }
      animations:
        - url: assets/animations/measurement-error-dependent-variable.gif
          caption: "Measurement error in Y widens the intervals and raises Type II risk, without biasing the slope."
        - url: assets/animations/attenuation-bias-positive-slope.gif
          caption: "Measurement error in X pulls a positive slope toward zero."
        - url: assets/animations/attenuation-bias-negative-slope.gif
          caption: "The same attenuation on a negative slope — again toward zero, not simply smaller."
  labs:
    - title: Lab P106 — Non-linear Models
      blurb: >
        Fit and interpret a quadratic regression and a logged regression, and report the
        marginal effect at meaningful values of X.
      links:
        - { label: Instructions, url: labs1/lab-06-instructions.html, kind: html }
        - { label: RMD Template, url: labs1/lab-06-template.rmd, kind: rmd, raw: true }

- id: threats-and-power
  number: "07"
  part: "Part 1 — Regression Foundations"
  title: Threats to Inference and Statistical Power
  tagline: The seven ways a regression lies to you, and whether your study could detect anything at all.
  summary: >
    Consolidates the seven main threats to regression inference, from selection and omitted
    variables to multicollinearity and simultaneity. Statistical power asks the mirror-image
    question: whether a study could have detected a real effect in the first place.
  overview: |
    A consolidated tour of the things that corrupt a regression inference: selection,
    omitted variable bias, measurement error, specification, group heterogeneity,
    multicollinearity, and simultaneity. Most of the sequence so far has been a slow walk
    through the middle of that list; this unit puts the whole set in one place.

    Statistical power is the mirror-image question. Before asking whether a program worked,
    ask whether the study was ever capable of showing that it worked — a null result from an
    underpowered design carries almost no information.
  objectives:
    - Name the mechanism behind each of the seven threats and its signature in the output.
    - Diagnose which threat is most plausible in a given study design.
    - Assess whether a design has enough power to detect an effect worth detecting.
  readings:
    - title: Seven Sins of Regression Analysis
      cite: Concise one-page summary of all seven threats.
      url: handouts/Seven-Sins-of-Regression-Analysis.pdf
    - title: Difference-in-Difference Models
      cite: One design-based route around several of the seven.
      url: handouts/Difference-in-Difference-Models.pdf
  lectures:
    - title: Seven Sins of Regression
      blurb: Selection, omitted variables, measurement error, specification, heterogeneity, multicollinearity, simultaneity.
      links:
        - { label: Notes, url: lectures1/p-10-seven-sins-of-regression-notes.html, kind: notes }
        - { label: Slides (PDF), url: lectures1/p-10-seven-sins-of-regression.pdf, kind: pdf }
        - { label: PPTX, url: lectures1/p-10-seven-sins-of-regression.pptx, kind: pptx, download: true }
    - title: Statistical Power
      blurb: Effect size, sample size, and the probability of detecting an effect that is really there.
      links:
