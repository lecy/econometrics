- id: cf-validity-and-varieties
  part: "Part 2 — Research Design and Counterfactuals"
  number: "09"
  title: Testing and Varieties of the Counterfactual
  tagline: Selection, attrition, balance tests, and the three estimators you can build.
  summary: >
    Tests whether treatment and comparison groups are comparable, using balance tables,
    attrition checks, and the Bonferroni correction. Introduces the three counterfactual
    estimators and the assumption each requires, then defines effect sizes and statistical
    power for research design.
  overview: |
    Two lectures that belong together. The first asks whether your groups are comparable at
    all — the selection problem, non-random attrition, and the balance table that every
    study should report. The second asks what to compute once they are: the reflexive,
    post-test-only, and difference-in-difference estimators.

    The organizing insight is that diff-in-diff is the general case. Reflexive is valid only
    when there is no secular trend; post-test-only is valid only when the groups were
    equivalent at baseline. Each of the weaker estimators is a bet that one term drops out.
  objectives:
    - Explain why participants differ from non-participants, and what randomization or matching fixes.
    - Apply the Bonferroni correction to a table of contrasts and decide whether groups are equivalent.
    - Distinguish random from non-random attrition and run the tests that tell them apart.
    - Compute all three estimators and state the identifying assumption each one needs.
  readings:
    - title: A Dialogue with Tom Cook and Michael Scriven
      cite: Cook, Scriven, Coryn & Evergreen (2010). Contemporary thinking about causation in evaluation.
      url: pubs/conversation-with-tom-cook-and-michael-scriven.pdf
    - title: A Review of Quasi-Experimental Design
      cite: Where quasi-experimental methods sit relative to the randomized trial.
      url: pubs/review-of-quasi-experimental-design.pdf
    - title: Alternatives to Randomized Control Trials
      cite: When an RCT is impractical or unethical, and what replaces it.
      url: pubs/alternatives-to-randomized-control-trials.pdf
    - title: Examples of Quasi-Experiments in Public Health
      cite: Worked designs from the health literature.
      url: pubs/examples-quasi-experiments-public-health.pdf
  lectures:
