- id: counterfactual-analysis
  part: "Part 2 — Research Design and Counterfactuals"
  number: "08"
  title: Counterfactual Analysis
  tagline: The world that did not happen, and why choosing it decides your answer.
  overview: |
    A causal claim is a counterfactual claim in disguise: to say the program caused the
    outcome is to say the outcome would not have occurred without it. Since we only get one
    world, we build comparison groups that stand in for the one we cannot observe.

    The running example is a suburban California school district with an unusual number of
    student suicides. Tested against the state population it looks high; against all high
    school students it looks average; against suburban high school students it looks low.
    Same data, same model, three defensible counterfactuals, three opposite conclusions.
  objectives:
    - Define a counterfactual and explain why every causal claim implies one.
    - Identify the comparison group hiding inside any null hypothesis.
    - Distinguish a comparison group from a control group.
    - Construct the elements of a randomized control trial and check they were implemented correctly.
  readings:
    - title: "Improving Cognitive Ability in Chronically Deprived Children (Ch. 5)"
      cite: "Bingham & Felbinger, Evaluation in Practice. The RCT case study used in Lab P201."
      url: pubs/eval-in-practice-CH5-randomized-control-trial.pdf
    - title: Causal Inference Based Upon Counterfactuals
      cite: Background on the potential-outcomes framework.
      url: pubs/causal-inference-based-upon-counterfactuals.pdf
    - title: An Introduction to Causal Inference
      cite: Elwert. Graphical models and the logic of confounding.
      url: pubs/1-Elwert_Causal_Intro.pdf
    - title: Using Regression Models to Estimate Program Effects
      cite: Reichardt & Bormann (1994). Carried over from the first course.
      url: pubs/Estimating%20Program%20Effects%20Using%20Regression%20Models.pdf
  lectures:
    - title: Introduction to Counterfactual Analysis
      blurb: Lewis on subjunctive conditionals, the treatment effect as a difference of means, and five examples where the comparison group decides the result.
      links:
        - { label: Notes, url: lectures2/p-01-intro-to-counterfactuals-notes.html, kind: notes }
        - { label: Slides (PDF), url: lectures2/p-01-intro-to-counterfactuals.pdf, kind: pdf }
        - { label: PPTX, url: lectures2/p-01-intro-to-counterfactuals.pptx, kind: pptx, download: true }
    - title: Contrasts and Effect Size
      blurb: One staggered-start study read four different ways — dosage, pooling, and the age confound.
      links:
        - { label: Notes, url: lectures2/p-01.01-counterfactual-example-notes.html, kind: notes }
        - { label: Slides (PDF), url: lectures2/p-01.01-counterfactual-example.pdf, kind: pdf }
        - { label: PPTX, url: lectures2/p-01.01-counterfactual-example.pptx, kind: pptx, download: true }
  labs:
    - title: Lab P201 — Counterfactual Reasoning with RCTs
      blurb: >
        Read the Bingham & Felbinger cognitive-ability study and report on the control group,
        the program theory, the treatment and its duration, and the confounding factors.
      links:
