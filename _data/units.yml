- id: dummy-variable-specifications
  part: "Part 2 — Research Design and Counterfactuals"
  number: "14"
  title: Practicing Dummy Variable Specifications
  tagline: Start from the hypothesis, then choose the coding that puts it on a single coefficient.
  summary: >
    Fourteen exercises that start from a picture of group means and a research question, and
    ask for the regression whose coefficient tests it. They cover t-tests as regressions,
    reference categories, interactions, difference-in-differences, dosage, interrupted time
    series, regression discontinuity, outliers, and structural breaks.
  overview: |
    Every regression tests each coefficient against zero, so the specification decides which
    questions get answered. A dummy variable's coefficient is the gap between its category
    and the omitted one, measured where every other predictor equals zero. The two coding
    decisions that matter are therefore the **reference category** and the **zero point** of
    any continuous variable.

    The exercises apply that one rule to fourteen designs, each a figure and a question. The
    work is to define the indicators, write the equation, state the null hypothesis as a
    coefficient restriction, and read every coefficient back off the picture. The designs run
    from one- and two-sample t-tests through 2 × 2 interactions and difference-in-differences
    to interrupted time series, regression discontinuity, a pile-up of cases at zero, a single
    outlying year absorbed by its own dummy, and COVID-era anomalies followed by a new regime. Worked solutions follow the questions, with
    the design matrix, every coefficient's meaning, and the most common wrong specification.
  objectives:
    - Translate a research question into a restriction on a single regression coefficient.
    - Choose the reference category and centering point that make that restriction the default test.
    - Recover every group mean, intercept, and slope from a fitted model by adding coefficients.
