        - { label: CF validity, url: lectures2/p-02-tests-for-cf-validity-notes.html, kind: notes }
        - { label: Three estimators, url: lectures2/p-03-varieties-of-counterfactuals-notes.html, kind: notes }
        - { label: Campbell Scores, url: lectures2/p-07-campbell-scores-v2-notes.html, kind: notes }
  labs:
