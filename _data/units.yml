- id: instrumental-variables
  part: "Part 3 — Regression Tools for Impact Analysis"
  number: "17"
  title: Instrumental Variables
  tagline: Borrow the part of your treatment that is uncorrelated with the error.
  overview: |
    When the policy variable is correlated with the error term — through omitted variables,
    measurement error, or simultaneity — OLS is biased and no amount of data fixes it. An
    instrument is a variable that moves the treatment but affects the outcome only through
    the treatment.

    Two-stage least squares makes the logic explicit: regress the endogenous variable on the
    instrument, keep the fitted values, and use those in the second stage in place of the
    original variable.

    ```r
    first.stage  <- lm( x1 ~ z + x2, data=dat )
    x1_hat       <- fitted( first.stage )
    second.stage <- lm( y ~ x1_hat + x2, data=dat )
    ```
  objectives:
    - State the two conditions a valid instrument must satisfy.
    - Run two-stage least squares by hand and with a canned estimator.
    - Compare the full, naive, and IV models and explain the pattern in the slopes.
  readings:
    - title: Causal Inference — What If
      cite: Hernán & Robins. Reference text; the IV chapters are the relevant ones here.
      url: pubs/causal-inference-what-if-full-text.pdf
  lectures:
    - title: Instrumental Variables
      blurb: Endogeneity, the exclusion restriction, and 2SLS built up one regression at a time.
      links:
        - { label: Lecture, url: lectures3/p-050-instrumental-variables.html, kind: html }
        - { label: RMD Source, url: lectures3/p-050-instrumental-variables.rmd, kind: rmd, raw: true }
  labs:
