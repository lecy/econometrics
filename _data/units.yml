- id: logistic-regression
  part: "Part 3 — Regression Tools for Impact Analysis"
  number: "19"
  title: Logistic Regression
  tagline: Binary outcomes, log-odds, and why marginal effects depend on where you stand.
  overview: |
    When the outcome is yes/no — admitted, employed, enrolled — the linear probability model
    can predict probabilities outside [0,1]. The logit link keeps predictions in range at the
    cost of coefficients that are no longer read directly.

    The model reports log-odds, which have to be converted to probabilities before they mean
    anything. And because the curve is not linear, the value of a change in X depends on the
    baseline: in the law school admissions example, a 10-point LSAT increase is worth very
    different amounts starting from 120, from 140, and from 170.
  objectives:
    - Explain why a linear probability model is inadequate for a binary outcome.
    - Convert log-odds to predicted probabilities.
    - Compute marginal effects, centering the other covariates, and interpret them at different baselines.
  readings:
    - title: Reporting Effect Sizes to Facilitate Cumulative Science
      cite: On reporting effects in a way readers can actually use.
      url: pubs/reporting-effect-sizes-to-facilitate-cumulative-science.pdf
    - title: "It's the Effect Size, Stupid"
      cite: Coe. Why the magnitude matters more than the p-value.
      url: pubs/its-the-effect-size-stupid.pdf
  lectures:
    - title: Logistic Regression
      blurb: The LPM, the logit link, log-odds to probabilities, and marginal effects across the range of X.
      links:
        - { label: Lecture, url: lectures3/p-070-logistic-regression.html, kind: html }
        - { label: RMD Source, url: lectures3/p-070-logistic-regression.rmd, kind: rmd, raw: true }
