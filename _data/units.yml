      cite: "Shin, I.-S., & Chung, J. Y. (2009). KEDI Journal of Educational Policy, 6(2), 3–19. Updated synthesis of U.S. studies, 1989–2008."
      url: lectures4/meta_analysis/class_size/META-2009-shin-chung.pdf
    - title: "Experimentology, Ch. 16 — Meta-Analysis"
      cite: "Frank, M. C., et al. Open textbook chapter; source of the forest plot in the slides."
      url: https://experimentology.io/016-meta.html
