- id: diff-in-diff
  part: "Part 3 — Regression Tools for Impact Analysis"
  number: "16"
  title: Difference-in-Difference Models
  tagline: The strong counterfactual, now as a regression rather than a table of four means.
  summary: >
    Recasts the difference-in-difference estimator as a regression, where the coefficient on a
    group-by-period interaction is the program effect. The groups need not be equivalent at
    baseline, but they must have been trending in parallel before the intervention.
  overview: |
    The estimator introduced in Unit 09 becomes a regression here. Two groups, two periods,
    and an interaction term whose coefficient is the program effect: the treated group's
    change minus the comparison group's change.

    Its strength is that the groups need not be equivalent at baseline — level differences
    difference out. What it does require is that the two groups were moving in parallel
    before the intervention, which is a testable claim whenever you have more than one
    pre-period.
  objectives:
    - Specify a difference-in-difference model as an interaction in regression.
    - Read the program effect off the interaction coefficient.
    - State and test the parallel trends assumption.
  readings:
    - title: Designing Difference-in-Difference Studies
      cite: "Wing, Simon & Bello-Gomez (2018), Annual Review of Public Health."
      url: https://www.annualreviews.org/doi/pdf/10.1146/annurev-publhealth-040617-013507
