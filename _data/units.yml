- id: matching
  part: "Part 3 — Regression Tools for Impact Analysis"
  number: "20"
  title: Propensity Score Matching
  tagline: Manufacture a comparison group by pairing each treated unit with its nearest twin.
  overview: |
    The post-test-only estimator needs equivalent groups, and observational data rarely
    supplies them. Matching builds them after the fact: model each unit's probability of
    being treated, then pair treated units with untreated units that had similar
    probabilities.

    The lecture works through distance calculations between treated and untreated students,
    nearest-neighbour matching with and without a caliper, and matching with and without
    replacement. What matching cannot do is balance anything you did not measure — which is
    why it addresses selection on observables only.
  objectives:
    - Estimate propensity scores with a logit model.
    - Apply nearest-neighbour matching and explain the role of the caliper distance.
    - Assess balance after matching, and state what matching cannot fix.
  readings:
    - title: A Review of Quasi-Experimental Design
      cite: Where matching sits relative to the other quasi-experimental tools.
      url: pubs/review-of-quasi-experimental-design.pdf
    - title: The Counterfactual in Program Evaluation
      cite: Schwartz. Framing reading for the matching approach.
      url: pubs/Schwartz_counterfactual.pdf
