- id: regression-discontinuity
  part: "Part 3 — Regression Tools for Impact Analysis"
  number: "18"
  title: Regression Discontinuity Design
  tagline: Near an arbitrary cutoff, who gets treated is almost random.
  overview: |
    When eligibility is determined by whether a running variable crosses a threshold — a
    test score, an income line, a date of birth — the units just above and just below the
    cutoff are close to comparable. The jump in outcomes at the threshold is the effect.

    The design buys credibility cheaply, and pays for it in generalizability: the estimate
    is a local effect at the cutoff, and says nothing about units far from it.
  objectives:
    - Identify a running variable and a cutoff in a policy setting.
    - Estimate the discontinuity and choose a sensible bandwidth.
    - Explain why the estimate is local and what would invalidate it.
  readings:
    - title: "Impact Evaluation in Practice, Ch. 5"
      cite: "Gertler et al. (2016). Regression discontinuity design."
      url: pubs/Impact_Evaluation_in_Practice%20WB%20full%20text%20second%20edition.pdf
  lectures:
    - title: Regression Discontinuity Design
      blurb: The cutoff, the local comparison, bandwidth choice, and what manipulation of the running variable would do.
      links:
        - { label: Lecture, url: lectures3/p-060-reg-discontinuity.html, kind: html }
        - { label: RMD Source, url: lectures3/p-060-reg-discontinuity.rmd, kind: rmd, raw: true }
  labs:
    - title: Lab P305 — Regression Discontinuity
      blurb: Fit the discontinuity, vary the bandwidth, and report how sensitive the estimate is.
      links:
        - { label: Instructions, url: labs3/regression-discontinuity-lab.html, kind: html }
        - { label: RMD Template, url: labs3/regression-discontinuity-lab.rmd, kind: rmd, raw: true }
