# ---------------------------------------------------------------------------
# Content for the one-page archive at index.md (layout: archive)
#
# Each unit renders as one section. Links use paths relative to the repo root;
# the layout runs them through Jekyll's relative_url filter, so absolute URLs
# (http://...) also work as-is.
#
# The same data also feeds the syllabus component (_includes/syllabus.html):
#   summary:        two-sentence description of the unit, used only by the syllabus
#   review: true    on a lecture item that points back to earlier decks rather than
#                   a new lecture; the syllabus lists its links as review material
#
# readings take title, cite, url, and an optional note (a one- or two-sentence
# annotation shown under the citation). reading_groups renders an annotated
# bibliography with subsections; each group has a group name, an optional intro,
# and items shaped like readings. The syllabus lists group items with a group tag.
# After editing this file, rebuild the standalone copy (handouts/syllabus.html) with:
#   ruby scripts/build_syllabus.rb
#
# link kinds control button styling:
#   notes  html  pdf  pptx  docx  data  rmd
#
# link flags:
#   download: true   save the file instead of opening it (same-origin files only)
#   raw: true        resolve the url against site.raw_root on GitHub instead of
#                    against the built site. Required for .rmd files: they carry a
#                    YAML header, so Jekyll excludes them from the build (see the
#                    exclude: block in _config.yml) and GitHub serves the original.
# ---------------------------------------------------------------------------

- id: nuts-and-bolts
  number: "01"
  part: "Part 1 — Regression Foundations"
  title: Nuts and Bolts of Regression
  tagline: Slopes, intercepts, residuals, and what a regression line actually claims.
  summary: >
    Builds a bivariate regression model from the ground up: sample variance, the slope and
    intercept, residuals, and the decomposition of the total sum of squares. The running
    example asks whether caffeine raises heart rate, a question that is easy to model and hard
    to interpret.
  overview: |
    The building blocks of a bivariate regression model: sample variance and standard
    deviation, the slope, the intercept, the regression line, and the error term.

    Before we can talk about causal impact we need a model that describes the
    *relationship* between a treatment and an outcome. The running example asks whether
    caffeine intake raises heart rate — a question that is easy to model and hard to
    interpret, which makes it a good place to start.
  objectives:
    - Explain what a regression slope represents (a conditional mean).
    - Write down and apply the formulas for the regression coefficients.
    - Tabulate residuals and decompose the total sum of squares.
  readings:
    - title: Using Regression Models to Estimate Program Effects
      cite: Reichardt, C. S., & Bormann, C. A. (1994). Handbook of Practical Program Evaluation.
      url: pubs/Estimating%20Program%20Effects%20Using%20Regression%20Models.pdf
    - title: "Applied Regression: An Introduction"
      cite: Lewis-Beck, C., & Lewis-Beck, M. (2015). Sage. Reference for the core formulas.
      url: pubs/Applied%20Regression%20Lewis-Beck.pdf
    - title: "OpenIntro Statistics, Ch. 8 — Introduction to Linear Regression"
      cite: Diez, D. M., Barr, C. D., & Cetinkaya-Rundel, M. (2012).
      url: pubs/openintro-statistics-sample.pdf
    - title: Regression Review Self-Test
      cite: Benchmark your baseline knowledge before starting the sequence.
      url: handouts/Regression-Review-Self-Test.pdf
    - title: Common Statistics Notation
      cite: One-page key to the symbols used throughout the lectures.
      url: handouts/Common-Statistics-Notation.pdf
  lectures:
    - title: Building a Regression Model
      blurb: Caffeine and heart rate, from scatterplot to fitted model to residual table.
      links:
        - { label: Lecture, url: lectures1/caffeine.html, kind: html }
        - { label: Data (CSV), url: lectures1/data/caffeine.csv, kind: data }
    - title: Total Sum of Squares Decomposition
      blurb: Where the variance of Y goes once a model is fit — SST, SSE, and SSR.
      links:
        - { label: Lecture, url: lectures1/total-sum-of-squares-decomposition.html, kind: html }
  labs:
    - title: Lab P101 — Regression Review
      blurb: >
        Calculate a bivariate slope and intercept by hand on five data points, tabulate
        residuals, and compute R-squared. Worked on paper rather than in R.
      links:
        - { label: Instructions, url: labs1/lab-01-instructions.html, kind: html }
        - { label: Worksheet (DOCX), url: labs1/Lab-01-Regression-Review.docx, kind: docx, download: true }
        - { label: Worksheet (PDF), url: labs1/Lab-01-Regression-Review.pdf, kind: pdf }

- id: variance-and-inference
  number: "02"
  part: "Part 1 — Regression Foundations"
  title: Variance, Standard Errors, and Confidence Intervals
  tagline: How much of your estimate is signal, and how far off is it likely to be?
  summary: >
    Traces a confidence interval back to its parts, from standard errors to the residuals and
    model they are built from. The key distinction is between the spread of the data (standard
    deviation) and the spread of estimates across repeated samples (standard error).
  overview: |
    Confidence intervals are built from standard errors, standard errors are built from
    residuals, and residuals come out of the regression model. This unit walks that chain
    backwards until the whole apparatus of hypothesis testing rests on quantities you can
    calculate by hand.

    The distinction that does the most work here is between the *distribution of the sample*
    (how spread out your data are) and the *sampling distribution* (how spread out your
    estimates would be across repeated samples). Standard deviation describes the first;
    standard error describes the second.
  objectives:
    - Build a confidence interval around a slope estimate of program impact.
    - Distinguish standard deviation from standard error, and totals from averages.
    - Read a regression table reporting several models side by side.
  readings:
    - title: Common Statistics Notation
      cite: Symbol key — worth keeping open while working through these lectures.
      url: handouts/Common-Statistics-Notation.pdf
    - title: "The New Statistics, Ch. 1"
      cite: Estimation, effect sizes, and why p-values are not the whole story.
      url: pubs/The%20New%20Statistics%20Chapter%201.pdf
    - title: "The New Statistics, Ch. 2"
      cite: Confidence intervals as the primary reporting unit.
      url: pubs/The%20New%20Statistics%20Chapter%202.pdf
  lectures:
    - title: Variance, Covariance, and the Regression Slope
      blurb: Everything in this lecture is built from one quantity — the deviation from the mean.
      links:
        - { label: Notes, url: lectures1/p-01-variance-covariance-slope-notes.html, kind: notes }
        - { label: Slides (PDF), url: lectures1/p-01-variance-covariance-slope.pdf, kind: pdf }
        - { label: PPTX, url: lectures1/p-01-variance-covariance-slope.pptx, kind: pptx, download: true }
    - title: Partitioning the Variance of Y
      blurb: Explained versus unexplained variance, and what R-squared is measuring.
      links:
        - { label: Notes, url: lectures1/p-02-partitioning-variance-notes.html, kind: notes }
        - { label: Slides (PDF), url: lectures1/p-02-partitioning-variance.pdf, kind: pdf }
        - { label: PPTX, url: lectures1/p-02-partitioning-variance.pptx, kind: pptx, download: true }
    - title: Standard Error of the Slope
      blurb: The three levers — residual variance, spread of X, and sample size.
      links:
        - { label: Notes, url: lectures1/p-03-standard-errors-notes.html, kind: notes }
        - { label: Slides (PDF), url: lectures1/p-03-standard-errors.pdf, kind: pdf }
        - { label: PPTX, url: lectures1/p-03-standard-errors.pptx, kind: pptx, download: true }
      animations:
        - url: assets/animations/sampling-process-n10.gif
          caption: "Repeated samples of 10 drawn from the same population — the raw material of a sampling distribution."
        - url: assets/animations/sampling-distribution-n10.gif
          caption: "One thousand slope estimates from samples of 10. The spread of the pile is the standard error."
        - url: assets/animations/sampling-distribution-n50.gif
          caption: "The same simulation at n = 50 — same true slope, a visibly tighter sampling distribution."
    - title: Confidence Intervals
      blurb: Turning a standard error into a range of plausible values for the true slope.
      links:
        - { label: Notes, url: lectures1/p-04-confidence-intervals-notes.html, kind: notes }
        - { label: Slides (PDF), url: lectures1/p-04-confidence-intervals.pdf, kind: pdf }
