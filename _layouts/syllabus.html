<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} · {{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
  /* Same palette and type as the archive (_layouts/archive.html) and the notes pages. */
  :root{
    --ground:#ffffff;
    --surface:#f3f4f6;
    --ink:#1f2429;
    --ink-mid:#4d565f;
    --ink-soft:#6d7681;
    --rule:#dcdfe4;
    --rule-strong:#c3c8cf;
    --accent:#bd5416;
    --accent-ink:#8f3f10;
    --accent-wash:#fbf0e7;
    --font-display:"Zilla Slab",Georgia,"Times New Roman",serif;
    --font-body:"Source Sans 3","Segoe UI",Helvetica,Arial,sans-serif;
    --font-math:"Source Serif 4",Cambria,Georgia,"Times New Roman",serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#15181c; --surface:#1d2126; --ink:#e3e6ea; --ink-mid:#a9b2bc; --ink-soft:#8b949e;
      --rule:#2d333a; --rule-strong:#3d444d; --accent:#ee8b4a; --accent-ink:#f2a771; --accent-wash:#291d14;
    }
  }
  :root[data-theme="dark"]{
    --ground:#15181c; --surface:#1d2126; --ink:#e3e6ea; --ink-mid:#a9b2bc; --ink-soft:#8b949e;
    --rule:#2d333a; --rule-strong:#3d444d; --accent:#ee8b4a; --accent-ink:#f2a771; --accent-wash:#291d14;
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:4.5rem;}
  body{
    margin:0;
    background:var(--ground);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:1.0625rem;
    line-height:1.62;
  }
  .wrap{max-width:64rem;margin:0 auto;padding:0 1.5rem 4rem;}

  .bar{
    position:sticky;top:0;z-index:20;
    background:color-mix(in srgb, var(--ground) 92%, transparent);
    backdrop-filter:saturate(160%) blur(8px);
    border-bottom:1px solid var(--rule);
  }
  .bar-inner{max-width:64rem;margin:0 auto;padding:.65rem 1.5rem;display:flex;align-items:baseline;gap:1.25rem;flex-wrap:wrap;}
  .bar-brand{font-family:var(--font-display);font-weight:700;text-decoration:none;color:var(--ink);white-space:nowrap;}
  .bar-nav{display:flex;gap:.15rem;flex-wrap:wrap;margin-left:auto;align-items:baseline;}
  .bar-nav a,.bar-nav button{
    font:600 .8125rem/1.4 var(--font-body);
    color:var(--ink-soft);
    text-decoration:none;
    padding:.15rem .45rem;
    border-radius:2px;
    background:none;
    border:0;
    cursor:pointer;
  }
  .bar-nav a:hover,.bar-nav button:hover{color:var(--accent-ink);background:var(--accent-wash);}
  @media (max-width:46rem){ .bar-nav .part-link{display:none;} }

  .masthead{padding:3.5rem 0 2rem;border-bottom:1px solid var(--rule);}
  .eyebrow{font-size:.8125rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--accent-ink);margin:0 0 .9rem;}
  .masthead h1{font-family:var(--font-display);font-weight:700;font-size:2.75rem;line-height:1.04;letter-spacing:-.02em;margin:0 0 .9rem;}
  .masthead .dek{margin:0;color:var(--ink-mid);max-width:40rem;font-size:1.2rem;line-height:1.5;}

  @media (max-width:640px){ .masthead h1{font-size:2.1rem;} .wrap{padding:0 1rem 3rem;} }

  @media print{
    .bar{display:none;}
    body{font-size:10.5pt;background:#fff;color:#000;}
    .wrap{max-width:none;padding:0;}
    .masthead{padding:0 0 1rem;}
    .masthead h1{font-size:22pt;}
  }
</style>
</head>
<body>

<div class="bar">
  <div class="bar-inner">
    <a class="bar-brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="bar-nav">
      {% assign nav_parts = site.data.units | group_by: "part" %}
      {% for g in nav_parts %}<a class="part-link" href="#syllabus-part-{{ forloop.index }}">{{ g.name | split: " — " | first }}</a>{% endfor %}
      <a href="{{ '/' | relative_url }}">Course archive</a>
      <button type="button" onclick="window.print()">Print</button>
    </nav>
  </div>
</div>

<div class="wrap">
  <header class="masthead">
    <p class="eyebrow">Syllabus</p>
    <h1>{{ page.heading | default: site.title }}</h1>
    {% if page.dek %}<p class="dek">{{ page.dek }}</p>{% endif %}
  </header>

  {{ content }}
</div>

</body>
</html>
